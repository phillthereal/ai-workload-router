[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workload-router"
version = "0.1.0"
description = "Routes LLM tasks to the cheapest capable model while logging cost, latency, and quality"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116,<1",
    "httpx>=0.28,<1",
    # transitive floors: PYSEC-2026-4024/4025 (anyio), PYSEC-2026-4320 (certifi); pip-audit 2026-10-25
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.17.3", "mypy==2.4.1"]
mcp = ["mcp>=2.3.0,<3"]
web = ["fastapi>=0.162,<1", "uvicorn>=0.54,<1"]
rag = ["fastembed>=0.9,<1", "pypdf>=6.21,<7"]

[project.scripts]
ai-router-mcp = "router.mcp_server:main"
ai-router-web = "router.web:main"

[tool.setuptools.package-data]
router = ["*.html", "*.json"]
# Entry point: python run_benchmark.py (see README for usage)

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# D10x: public classes, methods and functions need a docstring (src/ only, below).
select = ["E", "F", "W", "B", "D101", "D102", "D103"]
ignore = [
    "E402",  # scripts and tests must edit sys.path before importing router
    "E401", "E501", "E701", "E702", "E731", "E741",  # style only; fixing is churn
    "B905",  # zip(strict=) would raise where today it truncates: a behaviour change
]

[tool.ruff.lint.per-file-ignores]
"!src/**" = ["D101", "D102", "D103"]  # scripts and tests are not a public API
"experiments/*" = ["B007", "B023"]    # frozen research scripts; their lambdas run inside the loop

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "router.server"
disable_error_code = ["func-returns-value"]  # handlers use `return self._err(...)` as an early exit
