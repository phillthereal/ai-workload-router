name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The suite is fully offline by design (AWR_FORCE_MOCK routes all
      # provider calls to the deterministic mock adapter), so CI needs no
      # API keys and costs nothing to run.
      - name: Run test suite (offline)
        env:
          AWR_FORCE_MOCK: "1"
        run: python -m unittest discover -s tests -v
      - name: Offline benchmark smoke run
        env:
          AWR_FORCE_MOCK: "1"
        run: python run_benchmark.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Unlike the test job, mypy needs the real dependencies to check against.
      - name: Install project with dev tools
        run: pip install -e ".[dev,mcp,web]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      # The test job has no dependencies, so it skips these.
      - name: Web API tests
        env:
          AWR_FORCE_MOCK: "1"
        run: python -m unittest tests.test_web -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start both services with Docker Compose
        run: |
          # Throwaway token for this run only; never stored in a file.
          TOKEN="$(openssl rand -hex 16)"
          echo "::add-mask::$TOKEN"
          echo "AWR_SERVER_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          AWR_SERVER_TOKEN="$TOKEN" docker compose up --build --detach --wait
      - name: Smoke test the web app and the API
        run: |
          curl -fsS -o /dev/null http://localhost:8000/
          curl -fsS -H "Content-Type: application/json" -d '{"prompt":"What is 2+2?"}' \
            http://localhost:8000/route | grep -q '"simulated":true'
          curl -fsS -o /dev/null http://localhost:8000/healthz
          curl -fsS -o /dev/null http://localhost:8787/healthz
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $AWR_SERVER_TOKEN" http://localhost:8787/v1/models)
          test "$code" = 200 || { echo "models with token: $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/v1/models)
          test "$code" = 401 || { echo "models without token: $code"; exit 1; }
          curl -fsS -H "Authorization: Bearer $AWR_SERVER_TOKEN" -H "Content-Type: application/json" \
            -d '{"model":"router","messages":[{"role":"user","content":"What is 2+2?"}]}' \
            http://localhost:8787/v1/chat/completions | grep -q '"simulated": *true'
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs
